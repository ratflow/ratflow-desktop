set -g default-command /usr/bin/zsh

set -g default-terminal "xterm-256color"

# Set the prefix to Ctrl+a
#set -g prefix C-a

# Remove the old prefix
# unbind C-b

# Send Ctrl+a to applications by pressing it twice
bind C-a send-prefix

# enable mouse
set -g mouse

# disable auto-copy selection
#bind-key -T copy-mode-vi MouseDragEnd1Pane send -X cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection primary -filter | xclip -selection clipboard"


#bind-key    -T root         MouseDrag1Pane       if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
#bind-key    -T root         WheelUpPane          if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
#bind-key    -T copy-mode    WheelUpPane          select-pane \; send-keys -X -N 5 scroll-up
#bind-key    -T copy-mode    WheelDownPane        select-pane \; send-keys -X -N 5 scroll-down

#bind-key    -T copy-mode    MouseDrag1Pane       select-pane \; send-keys -X begin-selection
#bind-key    -T copy-mode    MouseDragEnd1Pane    send-keys -X stop-selection
#bind-key    -T copy-mode    MouseDown1Pane    send-keys -X clear-selection

# set status bar color
set -g status-bg "dark cyan"

# window rename
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}:#{b:pane_current_path}'


# coby buffer to clipboard
bind C-c run "tmux save-buffer - | xclip -i -sel clipboard >/dev/null"

bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
  set window-status-current-format "#[fg=$color_window_off_status_bg,bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:#W# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
  set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S
  
wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"

set -g status-right "$wg_is_keys_off #{sysstat_cpu} | #{sysstat_mem} | #{sysstat_loadavg} | $wg_user_host"

